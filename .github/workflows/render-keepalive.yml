name: Keep Render Service Warm

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping Ass Al Halaal health endpoint
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --retry-delay 5 \
            --max-time 60 \
            "https://ass-al-halaal.onrender.com/api/health"
