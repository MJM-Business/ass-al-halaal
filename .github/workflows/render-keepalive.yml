name: Keep Render Service Warm

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Ass Al Halaal health endpoint
        run: |
          curl --fail --silent --show-error \
            --retry 4 \
            --retry-delay 10 \
            --max-time 90 \
            "https://ass-al-halaal.onrender.com/api/health"
