  <style id="ahl-first-paint-css">
    html,body{margin:0;background:#fff;color:#173f35;font-family:Arial,sans-serif}
    .skip-link{position:absolute;left:-9999px}
    #app>.ahl-first-paint{min-height:100vh;background:#fff}
    .ahl-fp-header{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid #ece9df;box-sizing:border-box;background:#fff}
    .ahl-fp-brand{display:flex;align-items:center;gap:10px;font-weight:800;color:#0b5f49}
    .ahl-fp-mark{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:2px solid #d8b24b;color:#0b5f49;font-size:18px;font-weight:900;background:#fff}
    .ahl-fp-actions{display:flex;gap:9px}.ahl-fp-actions i{width:34px;height:34px;border:1px solid #ddd8c8;border-radius:50%;display:block;background:#fff}
    .ahl-fp-hero{margin:12px 14px 0;min-height:420px;border:2px solid #d8b24b;border-radius:22px;box-sizing:border-box;background:linear-gradient(180deg,#07513f 0%,#043d31 100%);color:#fff;padding:38px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;box-shadow:0 13px 30px rgba(4,58,45,.13)}
    .ahl-fp-badge{display:inline-block;padding:8px 14px;border:1px solid #e7c35f;border-radius:999px;color:#f4cd64;font-size:12px;font-weight:800}
    .ahl-fp-hero h1{margin:18px 0 12px;font-family:Georgia,'Times New Roman',serif;font-size:34px;line-height:1.08;color:#fff}
    .ahl-fp-hero h1 span{display:block;color:#f2c552}.ahl-fp-hero p{max-width:520px;margin:0;color:#e5eee9;font-size:13px;line-height:1.65}
    .ahl-fp-features{width:100%;max-width:430px;display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:20px}
    .ahl-fp-features b{display:block;padding:12px 8px;border:1px solid rgba(229,189,78,.35);border-radius:12px;background:rgba(255,255,255,.045);font-size:12px;color:#fff}
    .ahl-fp-cta{margin-top:18px;min-width:150px;padding:12px 22px;border-radius:999px;background:linear-gradient(180deg,#f6d779,#dda936);color:#4d380e;font-weight:900}
    @media(min-width:901px){.ahl-fp-header{height:94px;padding:0 28px}.ahl-fp-hero{min-height:500px;margin:16px 24px 0;padding:48px}.ahl-fp-hero h1{font-size:48px}.ahl-fp-features{grid-template-columns:repeat(4,1fr);max-width:760px}}
  </style>
  <link id="full-style" rel="stylesheet" href="dist/style.min.css?v=593" media="print" onload="this.media='all';window.__ahlStyleReady&&window.__ahlStyleReady()" />
  <link rel="preconnect" href="https://accounts.google.com" crossorigin />
</head>
<body>
  <a class="skip-link" href="#app-main">تخطي إلى المحتوى الرئيسي / Skip to main content</a>
  <div id="app">
    <div class="ahl-first-paint" aria-hidden="true">
      <div class="ahl-fp-header">
        <div class="ahl-fp-brand"><span class="ahl-fp-mark">ع</span><span>عاس الحلال</span></div>
        <div class="ahl-fp-actions"><i></i><i></i><i></i></div>
      </div>
      <section class="ahl-fp-hero">
        <span class="ahl-fp-badge">اختيارات طازجة وموثوقة</span>
        <h1><span>لحم حلال طازج،</span>مختار بعناية</h1>
        <p>ذبائح ولحوم مختارة بعناية مع تجهيز احترافي وتوصيل مبرد داخل جدة.</p>
        <div class="ahl-fp-features"><b>طازج ونظيف</b><b>تجهيز احترافي</b><b>توصيل مبرد</b><b>ثقة العائلات</b></div>
        <div class="ahl-fp-cta">تسجيل الدخول</div>
      </section>
    </div>
  </div>
  <dialog id="modal" aria-label="Ass Al Halaal dialog" aria-modal="true"></dialog>
  <div id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  <script>
    let __ahlResolveStyle;
    window.__ahlStylePromise=new Promise(resolve=>{__ahlResolveStyle=resolve});
    window.__ahlStyleReady=()=>__ahlResolveStyle();
    const __ahlStyle=document.getElementById('full-style');
    if(__ahlStyle?.sheet){__ahlStyle.media='all';window.__ahlStyleReady()}
    setTimeout(()=>window.__ahlStyleReady(),3500);
  </script>
  <script type="module">
    await window.__ahlStylePromise;
    await import('./dist/app.min.js?v=593');
  </script>
</body>
</html>
